<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom 2443 Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#16336b;--sky2:#0f2554;--snow:#eef4ff;--ink:#14213d;--red:#c8374b;--teal:#1f9d8f;--blue:#3b6fd4;--leaf:#4f9d3a;--sun:#e9a93a;--plum:#7c4fc2;--card:#f6f9ff;--mut:#5b6b8c}
*{box-sizing:border-box}
body{margin:0;font:400 1rem/1.55 Nunito,system-ui,sans-serif;color:var(--snow);background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 420px,#0b1b40 100%) fixed;min-height:100vh}
h1,h2,h3{font-family:'Pirata One',Georgia,serif;font-weight:400;margin:0;letter-spacing:.02em}
main{max-width:1000px;margin:0 auto;padding:0 18px 60px}
.top{display:flex;align-items:center;gap:16px;padding:22px 0 8px}
.shield{width:74px;height:86px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);display:grid;place-items:center;font:2rem 'Pirata One',serif;color:#fff;padding-bottom:10px;flex:none}
.top h1{font-size:2.3rem;line-height:1}
.top p{margin:4px 0 0;color:#b9c9ee}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:5;background:var(--sky);padding:10px 0 0;border-bottom:3px solid var(--red)}
.tab{flex:none;font:1.35rem 'Pirata One',Georgia,serif;letter-spacing:.03em;color:#cfe0ff;background:rgba(238,244,255,.1);border:0;border-radius:12px 12px 0 0;padding:8px 20px;cursor:pointer}
.tab:hover{background:rgba(238,244,255,.2)}
.tab[aria-selected=true]{background:var(--red);color:#fff}
.tab:focus-visible{outline:3px solid var(--sun);outline-offset:-3px}
.panel{margin-top:18px}
.hero{margin:0 0 26px;display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.banner{background:var(--red);color:#fff;padding:22px 24px 34px;clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 16px),0 100%);position:relative}
.banner h2{font-size:1.5rem;opacity:.92}
.clock{display:flex;gap:10px;margin-top:10px}
.clock div{text-align:center;min-width:64px}
.clock b{display:block;font:2.6rem/1 'Pirata One',serif}
.clock small{font-size:.8rem;opacity:.85}
.side{display:grid;gap:12px}
.mini{background:rgba(238,244,255,.1);border:2px solid rgba(238,244,255,.25);border-radius:14px 14px 14px 4px;padding:12px 16px}
.mini h3{font-size:1.15rem;color:#cfe0ff}
.mini p{margin:2px 0 0;font-weight:800;font-size:1.25rem}
.mini span{font-weight:400;font-size:.9rem;color:#b9c9ee}
.sec>h2{font-size:1.8rem;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sec>h2:after{content:"";flex:1;border-top:3px double rgba(238,244,255,.3)}
.live{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--card);color:var(--ink);border-radius:999px 999px 999px 6px;padding:6px 14px;font-weight:800;border-left:8px solid var(--blue)}
.chip small{display:block;font-weight:600;color:var(--mut);font-size:.78rem}
.day{margin-bottom:16px}
.day h3{font-size:1.3rem;color:#cfe0ff;margin-bottom:6px}
.row{background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;margin-bottom:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;border-left:8px solid var(--blue)}
.row.main{box-shadow:0 0 0 3px var(--sun)}
.row b{flex:1 1 180px}
.row time{color:var(--mut);font-size:.9rem}
.t-WAR{border-color:var(--red)}.t-ALLIANCE{border-color:var(--blue)}.t-PACK{border-color:var(--teal)}.t-GROWTH{border-color:var(--leaf)}.t-DEALS{border-color:var(--sun)}.t-SPECIAL{border-color:var(--plum)}
.tag{font-size:.75rem;font-weight:800;border-radius:6px;padding:1px 8px;background:#dfe8fb;color:var(--ink)}
.tag.p{background:#fff1cf}
.tag.open{background:#d5f2dc}
.codes{display:flex;flex-wrap:wrap;gap:10px}
.code{background:var(--card);color:var(--ink);border:2px dashed var(--blue);border-radius:10px;padding:8px 12px;font:800 1rem Nunito,sans-serif;cursor:pointer}
.code:focus-visible,.code:hover{background:#fff;outline:3px solid var(--sun)}
.ally{background:var(--card);color:var(--ink);border-radius:10px 10px 10px 4px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.atag{background:var(--red);color:#fff;font:1.4rem 'Pirata One',serif;min-width:66px;text-align:center;padding:6px 8px 16px;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}
.ally h3{color:var(--ink);font-size:1.35rem}
.ally p{margin:2px 0}
.ally .note{color:var(--mut)}
.ally .tag{margin-left:auto}
.note,#err{color:#b9c9ee;font-size:.9rem}
#err{background:#5a1f2c;color:#fff;padding:10px 14px;border-radius:10px;margin-top:12px}
footer{margin-top:40px;color:#8fa3cf;font-size:.85rem}
@media(prefers-reduced-motion:no-preference){.banner{animation:sway 5s ease-in-out infinite;transform-origin:top center}@keyframes sway{50%{transform:rotate(.4deg)}}}
</style>
</head>
<body>
<main>
<div class="top"><div class="shield">2443</div><div><h1>Kingdom
